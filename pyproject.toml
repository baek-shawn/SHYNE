[project]
name = "shyne"
version = "0.1.0"
description = "SHYNE: Local / Private Coding Agent"
requires-python = ">=3.11"
readme = "README.md"
# httpx: OpenAI-compatible API 호출, python-dotenv: .env 로드.
# fastapi/uvicorn은 Step 2(UI/API), pyyaml은 Step 3(config.yaml)에서 추가한다.
dependencies = [
    "httpx>=0.28.1",
    "python-dotenv>=1.2.3",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
